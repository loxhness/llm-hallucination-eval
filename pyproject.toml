[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "idk-eval"
version = "0.1.0"
description = "Test whether your LLM knows when to say 'I don't know' — abstention calibration for language models."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Uzair Suboor", email = "uzisuboor@hotmail.co.uk"}
]
keywords = ["llm", "evaluation", "hallucination", "abstention", "calibration", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "openai>=1.54.0",
    "anthropic>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
]
app = [
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
]
datasets = [
    "datasets>=2.14.0",
]

[project.scripts]
idk-eval = "idk_eval.cli:main"

[project.urls]
Homepage = "https://github.com/loxhness/idk-eval"
Issues = "https://github.com/loxhness/idk-eval/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
idk_eval = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
